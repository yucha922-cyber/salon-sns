<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fa" />
  <meta name="description" content="サロン事業者のSNS・広告運用を支援するAIマーケティングプラットフォーム" />
  <title>ナオル AI マーケティングパートナー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="ナオル ホーム"><span class="brand-mark">ナ</span><span class="brand-name">ナオル<span class="brand-dot">.</span></span></a>
      <button class="workspace-switcher"><span class="workspace-avatar">N</span><span class="workspace-info"><b>NAORU 渋谷店</b><small>ワークスペース</small></span><span class="chevron">⌄</span></button>
      <nav class="main-nav" aria-label="メインナビゲーション">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◫</span>ダッシュボード</button>
        <div class="nav-label">SNS</div>
        <button class="nav-item" data-page="planner"><span class="nav-icon">▦</span>投稿カレンダー</button>
        <button class="nav-item" data-page="creator"><span class="nav-icon">✎</span>AI投稿作成</button>
        <button class="nav-item" data-page="posts"><span class="nav-icon">▤</span>投稿一覧</button>
        <div class="nav-label">広告</div>
        <button class="nav-item" data-page="ads"><span class="nav-icon">⌁</span>広告ダッシュボード</button>
        <button class="nav-item" data-page="analysis"><span class="nav-icon">◉</span>AI分析<span class="nav-badge">2</span></button>
        <button class="nav-item" data-page="studio"><span class="nav-icon">✧</span>Creative Studio</button>
        <div class="nav-divider"></div>
        <button class="nav-item ai-nav" data-page="chat"><span class="nav-icon ai-spark">✳</span>AIマーケター<span class="online-dot"></span></button>
        <button class="nav-item" data-page="brand"><span class="nav-icon">◎</span>Brand Brain</button>
      </nav>
      <div class="sidebar-bottom"><button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>設定</button><div class="user-card"><div class="user-avatar">YK</div><div class="user-meta"><b>山本 花子</b><small>オーナー</small></div><button class="more-button">···</button></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="mobileMenu" aria-label="メニュー">☰</button><div class="breadcrumbs"><span>NAORU 渋谷店</span><span class="crumb-sep">/</span><b id="crumb">ダッシュボード</b></div><div class="top-actions"><span class="date-label" id="todayLabel"></span><button class="icon-button" aria-label="検索">⌕</button><button class="icon-button notification" aria-label="通知">♧<i></i></button><div class="top-avatar">YK</div></div></header>
      <div id="pageContent" class="page-content"></div>
    </main>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose">×</button><div id="modalContent"></div></section></div>
  <script src="app.js"></script>
</body>
</html>
